<!doctype html>
<html lang="ru">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />

	<title>Familiar Chat</title>

	<style>
		* {
			box-sizing: border-box;
		}

		html,
		body {
			margin: 0;
			height: 100%;
			font-family: system-ui, sans-serif;
			background: #111;
			color: #eee;
		}

		body {
			display: flex;
			justify-content: center;
		}

		main {
			width: 100%;
			max-width: 900px;
			height: 100%;
			display: flex;
			flex-direction: column;
		}

		header {
			padding: 16px 20px;
			border-bottom: 1px solid #333;
			font-weight: 600;
		}

		#messages {
			flex: 1;
			overflow-y: auto;
			padding: 20px;
			display: flex;
			flex-direction: column;
			gap: 16px;
		}

		.message {
			max-width: 80%;
			padding: 12px 16px;
			border-radius: 12px;
			line-height: 1.5;
			white-space: pre-wrap;
		}

		.message.user {
			align-self: flex-end;
			background: #2d5fff;
		}

		.message.assistant {
			align-self: flex-start;
			background: #252525;
		}

		form {
			display: flex;
			gap: 10px;
			padding: 16px;
			border-top: 1px solid #333;
		}

		textarea {
			flex: 1;
			resize: none;
			min-height: 44px;
			max-height: 160px;
			padding: 12px;
			border: 1px solid #444;
			border-radius: 10px;
			background: #1b1b1b;
			color: #eee;
			font: inherit;
			outline: none;
		}

		textarea:focus {
			border-color: #777;
		}

		button {
			padding: 0 20px;
			border: 0;
			border-radius: 10px;
			background: #eee;
			color: #111;
			font-weight: 600;
			cursor: pointer;
		}

		button:hover {
			background: #ccc;
		}
	</style>
</head>

<body>
	<main>
		<header>
			Familiar
		</header>

		<section id="messages">
			<div class="message assistant">
				Hello. How can I help?
			</div>
		</section>

		<form id="chatForm">
			<textarea
				id="input"
				placeholder="Write a message..."
				rows="1"
			></textarea>

			<button type="submit">
				Send
			</button>
		</form>
	</main>

    <script src="./main.js"></script>
</body>
</html>
